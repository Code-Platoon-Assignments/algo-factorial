name: factorial_jest

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Get node setup for JS
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build docker image
        run: docker build -t factorial_jest .
      - name: Run docker container
        run: docker run factorial_jest
